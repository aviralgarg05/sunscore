version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: sunscore-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - sunscore-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  sunscore:
    build: .
    container_name: sunscore-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://root:password@mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - sunscore-network

volumes:
  mongo_data:

networks:
  sunscore-network:
    driver: bridge

